name: Deploy to GitHub Pages

on:
  push:
    branches: [source]
  workflow_dispatch:

# 允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          # 拉取完整 git 历史，供 enableGitInfo 计算每篇文章真实的 lastmod/dateModified
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 发版后把 sitemap 中的新 URL 推给 Bing（IndexNow）
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 恢复 IndexNow 提交状态：缓存 .indexnow-submitted.txt，避免每次全量重推
      - name: Restore IndexNow submitted state
        uses: actions/cache/restore@v4
        with:
          path: scripts/.indexnow-submitted.txt
          key: indexnow-state-${{ github.run_id }}
          restore-keys: |
            indexnow-state-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Wait for sitemap to be live
        run: |
          for i in $(seq 1 12); do
            if curl -sf https://swaplyn.com/sitemap.xml >/dev/null; then
              echo "sitemap is live"; exit 0
            fi
            sleep 5
          done
          echo "sitemap not live after 60s" && exit 1

      - name: Submit new URLs to IndexNow
        run: python3 scripts/indexnow-submit.py

      # 保存更新后的提交状态，供下次增量提交使用
      - name: Save IndexNow submitted state
        uses: actions/cache/save@v4
        with:
          path: scripts/.indexnow-submitted.txt
          key: indexnow-state-${{ github.run_id }}

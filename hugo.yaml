baseURL: https://swaplyn.com/
locale: zh-CN
title: Swaplyn
theme: PaperMod

# 每页文章数
paginate: 10

# 构建未来日期的文章（避免 UTC 时区导致当天文章被判"未来"而跳过）
buildFuture: true

# 禁用 RSS 输出（避免生成大量 index.xml 造成薄内容与爬取浪费；发现渠道已有 sitemap + IndexNow）
disableKinds: ["RSS"]

# 用 git 提交时间作为 lastmod/dateModified 的真实来源（文章发布后再修改，日期也会随提交自动更新，不编造日期）
enableGitInfo: true

# lastmod 取值顺序：git 提交时间 → frontmatter 的 lastmod → date
frontmatter:
  lastmod: [":git", "lastmod", "date"]

# 开启阅读时间
params:
  env: production
  description: "Swaplyn 是面向中文用户的加密货币新手教程站，专注把每一步操作讲清楚：币安、OKX 注册开户与 KYC，现货合约手续费与返佣，USDT 转账选网络，钱包 Swap 兑换，以及新手最容易踩的坑。重要规则注明核验时间，涉及实测的内容明确标注。"
  # 首页 <title> 用更长的描述性标题（Bing 提示标题过短），其余页面仍用「页面标题 | 站点名」
  homeTitle: "Swaplyn｜币安、USDT、钱包与 Swap 新手操作教程"
  author: Swaplyn

  # 站点 Logo（纯文字，等新 logo 图做好后再补 icon）
  label:
    text: "Swaplyn"

  # 站点图标
  assets:
    favicon: /favicon.png
    favicon16x16: /favicon-16x16.png
    favicon32x32: /favicon-32x32.png
    apple_touch_icon: /apple-touch-icon.png

  # 首页显示
  homeInfoParams:
    Title: "加密货币新手操作指南"
    Content: "从币安注册、买 USDT，到转账、钱包与 Swap，把每一个容易出错的步骤讲清楚。"

  # 社交链接（可以先空着，后面再加）
  socialIcons: []

  # 显示阅读时间
  ShowReadingTime: true
  # 显示文章目录
  ShowToc: true
  # 显示面包屑导航
  ShowBreadCrumbs: true
  # 显示分享按钮
  ShowShareButtons: false
  # 显示上一篇/下一篇
  ShowPostNavLinks: true
  # 代码高亮
  ShowCodeCopyButtons: true

  # 日期格式
  dateFormat: "2006-01-02"

# 导航菜单：意图入口（币安/USDT/兑换）+ 全部教程 + 关于；首页由 Logo 承担
menu:
  main:
    - identifier: binance
      name: 币安
      url: /binance/
      weight: 1
    - identifier: usdt
      name: USDT
      url: /usdt/
      weight: 2
    - identifier: swap
      name: 兑换
      url: /swap/
      weight: 3
    - identifier: posts
      name: 全部教程
      url: /posts/
      weight: 4
    - identifier: about
      name: 关于
      url: /about/
      weight: 5

# 开启标签分类
taxonomies:
  category: categories
  tag: tags

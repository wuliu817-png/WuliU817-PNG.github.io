baseURL: https://swaplyn.com/
locale: zh-CN
title: CoinTrail 加密指南
theme: PaperMod

# 每页文章数
paginate: 10

# 开启阅读时间
params:
  env: production
  description: "CoinTrail 加密指南 — 币圈新手的入门第一课，专注加密货币入门教程、交易所攻略、安全避坑指南"
  author: CoinTrail

  # 站点 Logo
  label:
    text: "CoinTrail 加密指南"
    icon: /images/cointrail-logo.png
    iconHeight: 36

  # 站点图标
  assets:
    favicon: /favicon.png
    favicon16x16: /favicon-16x16.png
    favicon32x32: /favicon-32x32.png
    apple_touch_icon: /apple-touch-icon.png

  # 首页显示
  homeInfoParams:
    Title: "CoinTrail 加密指南 🚀"
    Content: "币圈新手的入门第一课。从零开始，学会安全买币、链上操作、避坑防骗。"

  # 社交链接（可以先空着，后面再加）
  socialIcons: []

  # 显示阅读时间
  ShowReadingTime: true
  # 显示文章目录
  ShowToc: true
  # 显示面包屑导航
  ShowBreadCrumbs: true
  # 显示分享按钮
  ShowShareButtons: false
  # 显示上一篇/下一篇
  ShowPostNavLinks: true
  # 代码高亮
  ShowCodeCopyButtons: true

  # 日期格式
  dateFormat: "2006-01-02"

# 导航菜单
menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 1
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 2
    - identifier: about
      name: 关于
      url: /about/
      weight: 3

# 开启标签分类
taxonomies:
  category: categories
  tag: tags

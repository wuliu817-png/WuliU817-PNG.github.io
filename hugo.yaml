baseURL: https://swaplyn.com/
locale: zh-CN
title: CoinTrail 加密指南
theme: PaperMod

# 每页文章数
paginate: 10

# 构建未来日期的文章（避免 UTC 时区导致当天文章被判"未来"而跳过）
buildFuture: true

# 禁用 RSS 输出（避免生成大量 index.xml 造成薄内容与爬取浪费；发现渠道已有 sitemap + IndexNow）
disableKinds: ["RSS"]

# 用 git 提交时间作为 lastmod/dateModified 的真实来源（文章发布后再修改，日期也会随提交自动更新，不编造日期）
enableGitInfo: true

# lastmod 取值顺序：git 提交时间 → frontmatter 的 lastmod → date
frontmatter:
  lastmod: [":git", "lastmod", "date"]

# 开启阅读时间
params:
  env: production
  description: "CoinTrail 加密指南 — 加密货币新手入门指南，从交易所注册、钱包安全到链上资产探索"
  author: CoinTrail

  # 站点 Logo
  label:
    text: "CoinTrail 加密指南"
    icon: /images/cointrail-logo.png
    iconHeight: 36

  # 站点图标
  assets:
    favicon: /favicon.png
    favicon16x16: /favicon-16x16.png
    favicon32x32: /favicon-32x32.png
    apple_touch_icon: /apple-touch-icon.png

  # 首页显示
  homeInfoParams:
    Title: "CoinTrail 加密指南"
    Content: "加密货币新手入门指南，从交易所注册、钱包安全到链上资产探索。"

  # 社交链接（可以先空着，后面再加）
  socialIcons: []

  # 显示阅读时间
  ShowReadingTime: true
  # 显示文章目录
  ShowToc: true
  # 显示面包屑导航
  ShowBreadCrumbs: true
  # 显示分享按钮
  ShowShareButtons: false
  # 显示上一篇/下一篇
  ShowPostNavLinks: true
  # 代码高亮
  ShowCodeCopyButtons: true

  # 日期格式
  dateFormat: "2006-01-02"

# 导航菜单
menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 1
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 2
    - identifier: about
      name: 关于
      url: /about/
      weight: 3

# 开启标签分类
taxonomies:
  category: categories
  tag: tags
